# deploy.yml ба ci.yml хуваалцдаг: суулгах → шалгах (TS + Python backend) → prepare-build → expo export.
name: build-web
description: Install, check, prepare and export the static web build
inputs:
  include-drafts:
    description: "prepare-build --include-drafts (зөвхөн preview)"
    default: "false"
runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: 24
        cache: npm

    - name: Install
      shell: bash
      run: npm ci --no-audit --no-fund

    - name: Setup uv (Python backend)
      uses: astral-sh/setup-uv@v10
      with:
        enable-cache: true
        cache-dependency-glob: backend/uv.lock

    # vars хоосон бол EXPO_PUBLIC_*-ийг огт тохируулахгүй — тэгвэл repo-ийн .env-ийн утга ашиглагдана
    - name: Public env (SITE_URL, DATA_BASE_URL)
      shell: bash
      run: |
        if [ -n "$SITE_URL" ]; then echo "EXPO_PUBLIC_SITE_URL=$SITE_URL" >> "$GITHUB_ENV"; fi
        if [ -n "$DATA_BASE_URL" ]; then echo "EXPO_PUBLIC_DATA_BASE_URL=$DATA_BASE_URL" >> "$GITHUB_ENV"; fi

    - name: Typecheck
      shell: bash
      run: npm run typecheck

    - name: Test
      shell: bash
      run: npm test

    - name: Backend checks (pytest, ruff, mypy)
      shell: bash
      working-directory: backend
      run: |
        uv run --locked pytest -q
        uv run --locked ruff check .
        uv run --locked ruff format --check .
        uv run --locked mypy

    - name: Validate reports
      shell: bash
      run: uv run --project backend --locked --no-dev kripto validate

    - name: Prepare build
      shell: bash
      run: npx tsx scripts/prepare-build.ts ${{ inputs.include-drafts == 'true' && '--include-drafts' || '' }}

    - name: Export web
      shell: bash
      run: |
        npx expo export --platform web
        npx tsx scripts/paint-first.ts
        npx tsx scripts/fix-static-index.ts
